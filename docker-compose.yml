services:
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_DB: trinetra, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/trinetra
      CORS_ORIGINS: http://localhost:5173
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8000:8000"]
    depends_on: [db,kafka]
  frontend:
    build: ./frontend
    environment: {VITE_API_BASE_URL: http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    depends_on: [backend]
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
volumes: {postgres_data: {}}
