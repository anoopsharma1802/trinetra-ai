services:
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_DB: trinetra, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["15432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/trinetra
      CORS_ORIGINS: http://localhost:5173
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8000:8000"]
    depends_on: [db,kafka]
  frontend:
    build: ./frontend
    environment: {VITE_API_BASE_URL: http://localhost:8000/api/v1}
    ports: ["5173:5173"]
    depends_on: [backend]
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
volumes: {postgres_data: {}}
